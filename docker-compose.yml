services:
  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    container_name: trackflow-ui
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
      - "${BACKOFFICE_PORT:-3001}:3001"
    volumes:
      - ./uis:/app/uis
      - ./packages:/app/packages
      - ./src:/app/src
      - /app/uis/website/node_modules
      - /app/uis/website/.next
      - /app/uis/backoffice/node_modules
      - /app/uis/backoffice/.next
    env_file:
      - .env
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
      INTERNAL_BACKEND_URL: "${INTERNAL_BACKEND_URL:-http://backend:8000}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trackflow-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: trackflow-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - /app/services/api/__pycache__
    environment:
      - PYTHONPATH=/app:/app/services:/app/services/api
    env_file:
      - .env
      - services/api/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trackflow-net
    restart: unless-stopped

networks:
  trackflow-net:
    name: trackflow-net
    driver: bridge
